name: Déploiement GitHub Pages

# Construit la PWA et la publie sur GitHub Pages à chaque push sur la branche.
# Une fois publiée, l'application est accessible depuis n'importe quel téléphone
# via l'URL indiquée dans l'onglet Actions / Settings → Pages.

on:
  push:
    branches: [claude/new-session-os5jdk]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Active GitHub Pages automatiquement (source = GitHub Actions).
      - name: Configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      # base = /<repo>/ pour un site "project pages" (https://user.github.io/ticketscope/)
      - run: npm run build -- --base=/ticketscope/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
